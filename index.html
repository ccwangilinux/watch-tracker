<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0E1A" />
    <meta name="description" content="我的觀看紀錄 — 追劇不忘，記錄精彩時刻" />

    <!-- iOS PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="觀看紀錄" />

    <!-- iOS 不讀 manifest 的 icons，必須另外指定 apple-touch-icon -->
    <link rel="apple-touch-icon" href="/watch-tracker/icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/watch-tracker/icons/favicon-32.png" />

    <title>我的觀看紀錄</title>

    <!--
      關鍵樣式內聯：外部 CSS 載入前若沒有底色，iOS standalone 啟動會先閃一下白畫面。
      iOS 不支援 manifest 的 splash，只能靠這個 + 下方的骨架來遮蓋啟動空窗。

      這一段底色會被下面的腳本、以及之後的 services/theme.ts 覆寫成當前主題的顏色。
      單獨成一個 <style> 是為了讓腳本能整段換掉而不動到骨架樣式。
    -->
    <style id="boot-paint">
      html, body { margin: 0; background: #0b0e1a; color: #eef1fb; }
    </style>

    <!--
      在 Vue 掛載前就把主題塗好。主題的權威值在 IndexedDB，但那是非同步的，
      等它讀完再套用，每次從主畫面啟動都會先閃一下預設的深藍底。
      localStorage 這份是純快取，讀不到就退回預設深色，絕不能因此擋住開機。
    -->
    <script>
      (function () {
        try {
          var boot = JSON.parse(localStorage.getItem('wt.boot') || 'null')
          if (!boot) return
          // 值是自己寫進去的，仍然驗過再塞進 CSS 字串，避免任何注入的可能
          var hex = /^#[0-9a-f]{3,8}$/i
          if (!hex.test(boot.bg) || !hex.test(boot.fg)) return

          var root = document.documentElement
          root.setAttribute('data-theme', boot.theme)
          root.setAttribute('data-scheme', boot.scheme)
          document.getElementById('boot-paint').textContent =
            'html,body{margin:0;background:' + boot.bg + ';color:' + boot.fg + '}'

          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.content = boot.bg
          var cs = document.querySelector('meta[name="color-scheme"]')
          if (cs) cs.content = boot.scheme
        } catch (e) {
          /* 無痕模式或資料損毀：用預設深色開機即可 */
        }
      })()
    </script>

    <style>
      .boot {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif;
      }
      .boot img { width: 88px; height: 88px; border-radius: 20px; }
      /* 跟著 html 的文字色淡化，深淺主題都讀得到 */
      .boot span { font-size: 14px; opacity: 0.55; letter-spacing: 0.05em; }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Vue 掛載後會整段取代掉 -->
      <div class="boot">
        <img src="/watch-tracker/icons/icon-192.png" alt="" />
        <span>我的觀看紀錄</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
