name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 使用 OIDC 部署，不需要任何 secret
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，但不取消進行中的，避免半途中斷留下壞掉的線上版本
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 測試不過就不要部署上去
      - run: npm test

      - run: npm run build
        env:
          # OAuth Client ID 設計上就是公開值（會出現在前端 bundle 中），
          # 因此用 repository variable 而非 secret。未設定時雲端功能會自動停用，
          # 但 App 的本機功能與 JSON 備份不受影響。
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      # 前提：repo 的 Settings → Pages → Source 必須先手動設為 GitHub Actions。
      # 這裡不用 enablement: true 自動建站，GITHUB_TOKEN 的權限不足以代為建立。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
